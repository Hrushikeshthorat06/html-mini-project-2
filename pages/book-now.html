<!DOCTYPE html>
<html lang="en">

<head>
    <title>Hrushikesh's HomeStay | Room Booking </title>
</head>

<body>
    <h1>
        Book your room today...
    </h1>

    <img src="./../img/Booking.png" height="300px">

    <form>
        <p> Full Name: </p>
        <input type="text" placeholder="Enter your Name" />

        <br /> <br />

        <p> Email : </p>
        <input type="email" placeholder="Enter your Email" />

        <br /> <br />

        <p> City :</p>
        <input type="text" placeholder="Enter city" />

        <br /> <br />

        <p> Mobile : </p>
        <input type="text" placeholder="Enter your Mobile " />

        <br /> <br />

        <p> Check In: </p>
        <input type="date" placeholder="Check In Date">

        <br /> <br />

        <p> Check Out:</p>
        <input type="date" placeholder="Check Out">

        <br /> <br />

        <p> Total Guests :</p>
        <input type="number" placeholder="total Guests" value="1" />

        <br /> <br />

        <Button> Book Now </Button>

    </form>

</body>

</html>
